<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Youth Event Registration</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { box-sizing: border-box; margin:0; padding:0; }

body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #b71c1c, #fff, #000); /* original red/white/black theme */
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px;
}

.container {
    width: 100%;
    max-width: 600px;
    background: white; /* keep container white */
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    text-align: center;
}

h2 {
    font-size: 1.8em;
    color: #b71c1c; /* red */
    margin-bottom: 20px;
}

label {
    font-weight: 600;
    margin-top: 15px;
    display: block;
    font-size: 1em;
    color: #000;
}

input {
    width: 100%;
    padding: 14px;
    margin-top: 6px;
    border-radius: 10px;
    border: 1px solid #000;
    font-size: 1em;
}

button {
    padding: 12px 16px;
    border: none;
    border-radius: 10px;
    font-size: 1em;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
}

button:hover { opacity: 0.9; }

.btn-primary { width: 100%; margin-top: 20px; background-color: #b71c1c; color: #fff; }
.btn-admin { width: 100%; margin-top: 10px; background-color: #000; color: #fff; }
.logout { width: 100%; margin-top: 20px; background-color: #000; color: #fff; }
.delete-btn { background: #e0e0e0; color: #333; padding: 8px 10px; }
.delete-btn:hover { background: #c62828; color: #fff; }

.result, .admin-login, .admin-panel, #qrcodeSection { display: none; }

img { max-width: 90%; height: auto; border-radius: 12px; margin-bottom: 15px; }

.qr-btn, .inquiry-link {
    display: block;
    width: fit-content;
    margin: 10px auto;
    padding: 12px 20px;
    background-color: #b71c1c;
    color: white;
    border-radius: 10px;
    cursor: pointer;
    text-decoration: none;
    font-weight: 600;
}

.qr-btn:hover, .inquiry-link:hover { opacity: 0.9; }

@media (max-width: 480px) {
    .container { padding: 20px; }
    h2 { font-size: 1.5em; }
    input, button { font-size: 1em; padding: 12px; }
}
</style>
</head>
<body>

<!-- REGISTRATION -->
<div class="container" id="registerPage">
    <h2>Youth Event Registration</h2>
    <label>Full Name</label>
    <input id="name" placeholder="Enter your full name">
    <label>Age</label>
    <input type="number" id="age" placeholder="Enter your age">
    <label>Church</label>
    <input id="church" placeholder="Enter your church">
    <button class="btn-primary" onclick="register()">Submit</button>
    <button class="btn-admin" onclick="showAdminLogin()">Login as Admin</button>
</div>

<!-- GREETING / THANK YOU SCREEN -->
<div class="container result" id="resultPage">
    <img src="https://raw.githubusercontent.com/leahjasolis-source/YPG-S-REGISTRATION/4191949a2e1600705c1b22ba44ec8d493b0b6499/ypg.jpg" alt="Greeting Image">
    <p style="font-size:1.2em; color:#000; font-weight:600; margin-bottom:15px;">
        Thank you for registering. We can't wait to see you!
    </p>
    <button class="qr-btn" onclick="showQRCode()">Pay via GCash 💳</button>

    <div id="qrcodeSection">
        <img class="qrcode-img" src="https://raw.githubusercontent.com/leahjasolis-source/YPG-S-REGISTRATION/bc845cf6ef92d27fe1ac65b92276ac2f58e5838c/QRCODE.jpg" alt="GCash QR Code">
        <a class="inquiry-link" href="https://www.facebook.com/share/16XKJoccg5/" target="_blank">
            For inquiries and questions, click here
        </a>
    </div>
</div>

<!-- ADMIN LOGIN -->
<div class="container admin-login" id="adminLogin">
    <h2>Admin Login</h2>
    <input type="password" id="adminPassword" placeholder="Password">
    <button class="btn-primary" onclick="loginAdmin()">Login</button>
</div>

<!-- ADMIN PANEL -->
<div class="container admin-panel" id="adminPanel">
    <h2>Registered Participants</h2>
    <table>
        <thead>
            <tr><th>Name</th><th>Age</th><th>Church</th><th>Team</th><th>Action</th></tr>
        </thead>
        <tbody id="adminTable"></tbody>
    </table>
    <button class="logout" onclick="logoutAdmin()">Logout</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyA_996opw31YVV82k9U7sW98L0LSrv_Asw",
  authDomain: "ypgsevent.firebaseapp.com",
  databaseURL: "https://ypgsevent-default-rtdb.firebaseio.com",
  projectId: "ypgsevent",
  storageBucket: "ypgsevent.firebasestorage.app",
  messagingSenderId: "55497113348",
  appId: "1:55497113348:web:a6113f3c00badd13191a51"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const participantsRef = ref(db, "participants");
const ADMIN_PASSWORD = "youthadmin123";

const teams = [
    { color: "White", name: "Team Truth Bearers" },
    { color: "Red", name: "Gospel Warriors" },
    { color: "Gold", name: "Team Christ Ambassadors" }
];

window.register = function() {
    const name = document.getElementById("name").value.trim();
    const age = document.getElementById("age").value;
    const church = document.getElementById("church").value.trim();
    if(!name || !age || !church) { alert("Complete all fields"); return; }
    const team = teams[Math.floor(Math.random() * teams.length)];
    push(participantsRef, { name, age, church, team: team.name });
    document.getElementById("registerPage").style.display = "none";
    document.getElementById("resultPage").style.display = "block";
}

window.showQRCode = function() {
    document.getElementById("qrcodeSection").style.display = "block";
    window.scrollTo(0, document.body.scrollHeight);
}

window.showAdminLogin = function() {
    document.getElementById("registerPage").style.display = "none";
    document.getElementById("adminLogin").style.display = "block";
}

window.loginAdmin = function() {
    if(document.getElementById("adminPassword").value !== ADMIN_PASSWORD) { alert("Wrong password"); return; }
    document.getElementById("adminLogin").style.display = "none";
    document.getElementById("adminPanel").style.display = "block";
    loadAdmin();
}

window.loadAdmin = function() {
    onValue(participantsRef, snapshot => {
        const adminTable = document.getElementById("adminTable");
        adminTable.innerHTML = "";
        snapshot.forEach(child => {
            const p = child.val();
            const key = child.key;
            const row = document.createElement("tr");
            row.innerHTML = `<td>${p.name}</td><td>${p.age}</td><td>${p.church}</td><td>${p.team}</td><td><button class="delete-btn" onclick="deleteParticipant('${key}')">Delete</button></td>`;
            adminTable.appendChild(row);
        });
    });
}

window.deleteParticipant = function(key) {
    if(!confirm("Are you sure you want to delete this participant?")) return;
    remove(ref(db, "participants/" + key));
}

window.logoutAdmin = function() {
    document.getElementById("adminPanel").style.display = "none";
    document.getElementById("registerPage").style.display = "block";
}
</script>
</body>
</html>
