<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Youth Event Registration</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { box-sizing: border-box; margin:0; padding:0; }

body {
    font-family: 'Segoe UI', sans-serif;
    background: #000;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px;
    color: #fff;
}

/* CONTAINERS */
.container {
    width: 100%;
    max-width: 600px;
    background: #fff;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.25);
    color: #000;
    display: none;
    text-align: center;
}

#registerPage, .admin-login, .admin-panel, #greetingPage {
    display: none;
}

h2 { text-align: center; margin-bottom: 20px; color:#c62828; font-size:1.8em; }

label { font-weight:600; margin-top:15px; display:block; font-size:1em; color:#000; }

input {
    width: 100%;
    padding: 14px;
    margin-top:6px;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:1em;
}

button {
    padding:12px 16px;
    border:none;
    border-radius:10px;
    font-size:1em;
    font-weight:600;
    cursor:pointer;
    transition:0.2s;
}

button:hover { opacity:0.9; }

.btn-primary {
    width:100%;
    margin-top:20px;
    background:#c62828;
    color:white;
}

.btn-admin {
    width:100%;
    margin-top:10px;
    background:#000;
    color:white;
}

.logout {
    width:100%;
    margin-top:20px;
    background:#000;
    color:white;
}

.delete-btn {
    background:#c62828;
    color:white;
    padding:8px 10px;
}

.delete-btn:hover { background:#e53935; }

table {
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
    font-size:0.95em;
}

th, td {
    padding:10px;
    border-bottom:1px solid #e0e0e0;
    text-align:center;
}

th { background:#f5f5f5; color:#000; }

/* GREETING QR IMAGE */
#greetingPage img {
    width:90%;
    max-width:400px;
    margin-top:20px;
    border-radius:15px;
}

/* MOBILE RESPONSIVE */
@media (max-width:480px) {
    .container { padding:20px; font-size:0.9em; }
    h2 { font-size:1.5em; }
    input, button { font-size:1em; padding:12px; }
    table, thead, tbody, th, td, tr { display:block; }
    thead tr { display:none; }
    tr { margin-bottom:15px; border-bottom:2px solid #eee; }
    td { text-align:right; padding-left:50%; position:relative; }
    td::before { content: attr(data-label); position:absolute; left:15px; width:45%; font-weight:600; text-align:left; }
}
</style>
</head>
<body>

<!-- REGISTRATION -->
<div class="container" id="registerPage" style="display:block;">
    <h2>Youth Event Registration</h2>

    <label>Full Name</label>
    <input id="name">

    <label>Age</label>
    <input type="number" id="age">

    <label>Church</label>
    <input id="church">

    <button class="btn-primary" onclick="register()">Submit</button>
    <button class="btn-admin" onclick="showAdminLogin()">Login as Admin</button>
</div>

<!-- GREETING PAGE -->
<div class="container" id="greetingPage">
    <h2>See You at the Event! 🎉</h2>
    <p>Scan the GCash QR code below to complete your payment:</p>
    <img src="https://raw.githubusercontent.com/leahjasolis-source/YPG-S-REGISTRATION/main/ypg.jpg" alt="GCash QR">
</div>

<!-- ADMIN LOGIN -->
<div class="container admin-login" id="adminLogin">
    <h2>Admin Login</h2>
    <input type="password" id="adminPassword" placeholder="Password">
    <button class="btn-primary" onclick="loginAdmin()">Login</button>
</div>

<!-- ADMIN PANEL -->
<div class="container admin-panel" id="adminPanel">
    <h2>Registered Participants</h2>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Church</th>
                <th>Team</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="adminTable"></tbody>
    </table>
    <button class="logout" onclick="logoutAdmin()">Logout</button>
</div>

<!-- FIREBASE SCRIPT -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, onValue, remove } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyA_996opw31YVV82k9U7sW98L0LSrv_Asw",
  authDomain: "ypgsevent.firebaseapp.com",
  databaseURL: "https://ypgsevent-default-rtdb.firebaseio.com",
  projectId: "ypgsevent",
  storageBucket: "ypgsevent.firebasestorage.app",
  messagingSenderId: "55497113348",
  appId: "1:55497113348:web:a6113f3c00badd13191a51"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const participantsRef = ref(db, "participants");

const ADMIN_PASSWORD = "youthadmin123";

const teams = [
    { color: "White", name: "Team Truth Bearers" },
    { color: "Red", name: "Gospel Warriors" },
    { color: "Gold", name: "Team Christ Ambassadors" }
];

/* REGISTER */
window.register = function() {
    const name = document.getElementById("name").value.trim();
    const age = document.getElementById("age").value;
    const church = document.getElementById("church").value.trim();

    if(!name || !age || !church) { alert("Complete all fields"); return; }

    const team = teams[Math.floor(Math.random()*teams.length)];

    push(participantsRef, { name, age, church, team: team.name });

    document.getElementById("registerPage").style.display="none";
    document.getElementById("greetingPage").style.display="block";
};

/* ADMIN */
window.showAdminLogin = function() {
    document.getElementById("registerPage").style.display="none";
    document.getElementById("adminLogin").style.display="block";
};

window.loginAdmin = function() {
    if(document.getElementById("adminPassword").value!==ADMIN_PASSWORD){
        alert("Wrong password"); return;
    }
    document.getElementById("adminLogin").style.display="none";
    document.getElementById("adminPanel").style.display="block";
    loadAdmin();
};

/* LOAD ADMIN */
window.loadAdmin = function() {
    onValue(participantsRef,(snapshot)=>{
        const adminTable = document.getElementById("adminTable");
        adminTable.innerHTML="";
        snapshot.forEach((child)=>{
            const p = child.val();
            const key = child.key;
            const row = document.createElement("tr");
            row.innerHTML=`
                <td data-label="Name">${p.name}</td>
                <td data-label="Age">${p.age}</td>
                <td data-label="Church">${p.church}</td>
                <td data-label="Team">${p.team}</td>
                <td data-label="Action">
                    <button class="delete-btn" onclick="deleteParticipant('${key}')">Delete</button>
                </td>
            `;
            adminTable.appendChild(row);
        });
    });
};

/* DELETE */
window.deleteParticipant = function(key) {
    if(!confirm("Are you sure you want to delete this participant?")) return;
    remove(ref(db,"participants/"+key));
};

/* LOGOUT */
window.logoutAdmin = function() {
    document.getElementById("adminPanel").style.display="none";
    document.getElementById("registerPage").style.display="block";
};
</script>

</body>
</html>
