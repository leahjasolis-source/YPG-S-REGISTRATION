<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Youth Event Registration</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; }

body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ff0000, #000000);
    min-height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px;
    color: white;
}

.container {
    width: 100%;
    max-width: 600px;
    background: rgba(255,255,255,0.95);
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.25);
}

h2 { text-align: center; margin-bottom: 20px; font-size: 1.8em; color:#ff0000; }

label {
    font-weight: 600;
    margin-top: 15px;
    display: block;
    font-size: 1em;
    color:#000;
}

input {
    width: 100%;
    padding: 14px;
    margin-top: 6px;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-size: 1em;
}

button {
    padding: 12px 16px;
    border: none;
    border-radius: 10px;
    font-size: 1em;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
}

button:hover { opacity: 0.9; }

.btn-primary {
    width: 100%;
    margin-top: 20px;
    background: linear-gradient(135deg, #ff0000, #000000);
    color: white;
}

.btn-admin { width: 100%; margin-top: 10px; background: #000; color:white; }

.logout {
    width: 100%;
    margin-top: 20px;
    background: linear-gradient(135deg, #555, #333);
    color: white;
}

.result, .admin-login, .admin-panel { display: none; text-align:center; }

.qrcode-img {
    display: none;
    width: 80%;
    max-width: 300px;
    height: auto;
    margin: 20px auto;
    border-radius: 15px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

.gcash-btn {
    display: none;
    margin: 10px auto 0 auto;
    padding: 12px 20px;
    background: #ff0000;
    color: white;
    font-weight: bold;
    border-radius: 12px;
    cursor: pointer;
    font-size: 1em;
}

.gcash-btn:hover {
    background: #cc0000;
}

.inquiry-link {
    display: none;
    margin-top: 15px;
    font-size: 1em;
    color: #0000ff;
    text-decoration: underline;
    cursor: pointer;
}

.inquiry-link:hover {
    color: #ff0000;
}

.thankyou-text {
    display:block;
    font-family: 'Comic Sans MS', cursive, sans-serif;
    font-size: 1.2em;
    margin-top: 20px;
    color:#000;
}
</style>
</head>
<body>

<!-- REGISTRATION -->
<div class="container" id="registerPage">
    <h2>Youth Event Registration</h2>

    <label>Full Name</label>
    <input id="name" placeholder="Enter your full name">

    <label>Age</label>
    <input type="number" id="age" placeholder="Enter your age">

    <label>Church</label>
    <input id="church" placeholder="Enter your church">

    <button class="btn-primary" onclick="register()">Submit</button>
    <button class="btn-admin" onclick="showAdminLogin()">Login as Admin</button>
</div>

<!-- RESULT / GREETING -->
<div class="container result" id="resultPage">
    <img src="https://github.com/leahjasolis-source/YPG-S-REGISTRATION/blob/4191949a2e1600705c1b22ba44ec8d493b0b6499/ypg.jpg" 
         style="width:100%; border-radius:15px; margin-bottom:15px;" alt="Greeting Image">

    <button class="gcash-btn" onclick="showQRCode()">Pay via GCash 💳</button>
    <img src="https://github.com/leahjasolis-source/YPG-S-REGISTRATION/blob/bc845cf6ef92d27fe1ac65b92276ac2f58e5838c/QRCODE.jpg" 
         id="gcashQRCode" class="qrcode-img" alt="GCash QR Code">

    <a href="https://www.facebook.com/share/16XKJoccg5/" target="_blank" class="inquiry-link" id="inquiryLink">For inquiries and questions, click here</a>

    <span class="thankyou-text">Thank you for registering. We can't wait to see you!</span>
</div>

<!-- ADMIN LOGIN -->
<div class="container admin-login" id="adminLogin">
    <h2>Admin Login</h2>
    <input type="password" id="adminPassword" placeholder="Password">
    <button class="btn-primary" onclick="loginAdmin()">Login</button>
</div>

<!-- ADMIN PANEL -->
<div class="container admin-panel" id="adminPanel">
    <h2>Registered Participants</h2>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Church</th>
                <th>Team</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="adminTable"></tbody>
    </table>

    <button class="logout" onclick="logoutAdmin()">Logout</button>
</div>

<script>
const ADMIN_PASSWORD = "youthadmin123";

window.register = function () {
    const name = document.getElementById("name").value.trim();
    const age = document.getElementById("age").value;
    const church = document.getElementById("church").value.trim();

    if (!name || !age || !church) { alert("Complete all fields"); return; }

    document.getElementById("registerPage").style.display = "none";
    const resultPage = document.getElementById("resultPage");
    resultPage.style.display = "block";

    // Show the GCash button and inquiry link
    const gcashBtn = document.querySelector(".gcash-btn");
    gcashBtn.style.display = "block";
    const inquiry = document.getElementById("inquiryLink");
    inquiry.style.display = "inline-block";
};

window.showQRCode = function () {
    document.getElementById("gcashQRCode").style.display = "block";
};

window.showAdminLogin = function () {
    document.getElementById("registerPage").style.display = "none";
    document.getElementById("adminLogin").style.display = "block";
};

window.loginAdmin = function () {
    if (document.getElementById("adminPassword").value !== ADMIN_PASSWORD) {
        alert("Wrong password"); return;
    }
    document.getElementById("adminLogin").style.display = "none";
    document.getElementById("adminPanel").style.display = "block";
};

window.logoutAdmin = function () {
    document.getElementById("adminPanel").style.display = "none";
    document.getElementById("registerPage").style.display = "block";
};
</script>

</body>
</html>
