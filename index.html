<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Youth Event Registration</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Google Font for "love" theme -->
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ff4b5c, #000000);
    min-height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px;
    color: white;
}

.container {
    width: 100%;
    max-width: 600px;
    background: rgba(0,0,0,0.9);
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    text-align: center;
}

h2 { margin-bottom: 20px; font-size: 1.8em; color: #ff4b5c; }

label {
    font-weight: 600;
    margin-top: 15px;
    display: block;
    font-size: 1em;
}

input {
    width: 100%;
    padding: 14px;
    margin-top: 6px;
    border-radius: 10px;
    border: 1px solid #ff4b5c;
    font-size: 1em;
    background: #000;
    color: white;
}

input::placeholder { color: #ccc; }

button {
    padding: 12px 16px;
    border: none;
    border-radius: 10px;
    font-size: 1em;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
    margin-top: 15px;
}

button:hover { opacity: 0.9; }

.btn-primary { width: 100%; background: #ff4b5c; color: white; }
.btn-admin { width: 100%; margin-top: 10px; background: #fff; color: #000; }
.logout { width: 100%; margin-top: 20px; background: #ff0000; color: white; }
.delete-btn { background: #ff4b5c; color: white; }

.result, .admin-login, .admin-panel, #qrContainer { display: none; }

.result img, #qrContainer img {
    width: 100%;
    max-width: 500px;
    margin-top: 20px;
    border-radius: 12px;
}

/* Love-themed message */
#thankYouMsg {
    font-family: 'Dancing Script', cursive;
    font-size: 1.8em;
    color: #ff4b5c;
    margin-top: 15px;
}

/* ===== MOBILE RESPONSIVE ===== */
@media (max-width: 480px) {
    .container { padding: 20px; font-size: 0.9em; }
    h2 { font-size: 1.5em; }
    input, button { font-size: 1em; padding: 12px; }
}
</style>
</head>
<body>

<!-- REGISTRATION -->
<div class="container" id="registerPage">
    <h2>Youth Event Registration</h2>

    <label>Full Name</label>
    <input id="name" placeholder="Enter your full name">

    <label>Age</label>
    <input type="number" id="age" placeholder="Enter your age">

    <label>Church</label>
    <input id="church" placeholder="Enter your church">

    <button class="btn-primary" onclick="register()">Submit</button>
    <button class="btn-admin" onclick="showAdminLogin()">Login as Admin</button>
</div>

<!-- GREETING SCREEN -->
<div class="container result" id="resultPage">
    <h2>See you there! 🎉</h2>
    <img src="https://raw.githubusercontent.com/leahjasolis-source/YPG-S-REGISTRATION/4191949a2e1600705c1b22ba44ec8d493b0b6499/ypg.jpg" alt="Youth Event">
    
    <button class="btn-primary" id="showQRBtn" onclick="showQR()">Show GCash QR Code</button>

    <div id="qrContainer">
        <img src="https://raw.githubusercontent.com/leahjasolis-source/YPG-S-REGISTRATION/328df7d43ee5f4aeef69c203a2543a5c1aa704f3/gcashqr.jpg" alt="GCash QR Code">
        <div id="thankYouMsg">Thank you for registering. We can't wait to see you!</div>
    </div>
</div>

<!-- ADMIN LOGIN -->
<div class="container admin-login" id="adminLogin">
    <h2>Admin Login</h2>
    <input type="password" id="adminPassword" placeholder="Password">
    <button class="btn-primary" onclick="loginAdmin()">Login</button>
</div>

<!-- ADMIN PANEL -->
<div class="container admin-panel" id="adminPanel">
    <h2>Registered Participants</h2>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Church</th>
                <th>Team</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="adminTable"></tbody>
    </table>

    <button class="logout" onclick="logoutAdmin()">Logout</button>
</div>

<!-- FIREBASE SCRIPT -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, onValue, remove } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyA_996opw31YVV82k9U7sW98L0LSrv_Asw",
  authDomain: "ypgsevent.firebaseapp.com",
  databaseURL: "https://ypgsevent-default-rtdb.firebaseio.com",
  projectId: "ypgsevent",
  storageBucket: "ypgsevent.firebasestorage.app",
  messagingSenderId: "55497113348",
  appId: "1:55497113348:web:a6113f3c00badd13191a51"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const participantsRef = ref(db, "participants");

const ADMIN_PASSWORD = "youthadmin123";
const teams = [
    { color: "White", name: "Team Truth Bearers" },
    { color: "Red", name: "Gospel Warriors" },
    { color: "Gold", name: "Team Christ Ambassadors" }
];

/* ===== REGISTER ===== */
window.register = function () {
    const name = document.getElementById("name").value.trim();
    const age = document.getElementById("age").value;
    const church = document.getElementById("church").value.trim();

    if (!name || !age || !church) { alert("Complete all fields"); return; }

    const team = teams[Math.floor(Math.random() * teams.length)];

    push(participantsRef, { name, age, church, team: team.name });

    document.getElementById("registerPage").style.display = "none";
    document.getElementById("resultPage").style.display = "block";
};

/* ===== SHOW QR ===== */
window.showQR = function() {
    document.getElementById("qrContainer").style.display = "block";
    document.getElementById("showQRBtn").style.display = "none";
};

/* ===== ADMIN ===== */
window.showAdminLogin = function () {
    document.getElementById("registerPage").style.display = "none";
    document.getElementById("adminLogin").style.display = "block";
};

window.loginAdmin = function () {
    if (document.getElementById("adminPassword").value !== ADMIN_PASSWORD) {
        alert("Wrong password"); return;
    }
    document.getElementById("adminLogin").style.display = "none";
    document.getElementById("adminPanel").style.display = "block";
    loadAdmin();
};

/* ===== LOAD ADMIN ===== */
window.loadAdmin = function () {
    onValue(participantsRef, (snapshot) => {
        const adminTable = document.getElementById("adminTable");
        adminTable.innerHTML = "";
        snapshot.forEach((child) => {
            const p = child.val();
            const key = child.key;
            const row = document.createElement("tr");
            row.innerHTML = `
                <td data-label="Name">${p.name}</td>
                <td data-label="Age">${p.age}</td>
                <td data-label="Church">${p.church}</td>
                <td data-label="Team">${p.team}</td>
                <td data-label="Action">
                    <button class="delete-btn" onclick="deleteParticipant('${key}')">Delete</button>
                </td>
            `;
            adminTable.appendChild(row);
        });
    });
};

/* ===== DELETE ===== */
window.deleteParticipant = function (key) {
    if (!confirm("Are you sure you want to delete this participant?")) return;
    remove(ref(db, "participants/" + key));
};

/* ===== LOGOUT ===== */
window.logoutAdmin = function () {
    document.getElementById("adminPanel").style.display = "none";
    document.getElementById("registerPage").style.display = "block";
};
</script>
</body>
</html>
