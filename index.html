<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Youth Event Registration</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; }

body {
    font-family: 'Segoe UI', sans-serif;
    background: #fff;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    width: 100%;
    max-width: 500px;
    background: #fff;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    text-align: center;
}

h2 {
    margin-bottom: 20px;
    color: #c62828; /* Red heading */
}

input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 10px;
    border: 1px solid #000;
}

button {
    width: 100%;
    padding: 15px;
    margin: 10px 0;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    opacity: 0.9;
}

.btn-primary { background: #c62828; color: white; }
.btn-admin { background: #000; color: white; }
.logout { background: #c62828; color: white; }
.delete-btn {
    background: #fff;
    color: #c62828;
    border: 1px solid #c62828;
}
.delete-btn:hover { background: #c62828; color: white; }

/* HIDE SECTIONS BY DEFAULT */
.result, .admin-login, .admin-panel, #greetingPage {
    display: none;
}

/* FULL-SCREEN GREETING */
#greetingPage {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #000;
    width: 100vw;
    height: 100vh;
    color: white;
}

#greetingPage h2 {
    color: #ffeb3b; /* yellow/gold greeting */
    font-size: 2em;
    margin-bottom: 20px;
}

#greetingPage img {
    width: 90vw;
    max-width: 400px;
    height: auto;
    border-radius: 15px;
    border: 4px solid #fff;
    object-fit: cover;
}

@media (max-width: 480px) {
    .container { padding: 20px; width: 90%; }
    #greetingPage img { width: 95vw; }
}
</style>
</head>
<body>

<!-- REGISTRATION -->
<div class="container" id="registerPage">
    <h2>Youth Event Registration</h2>

    <input id="name" placeholder="Full Name">
    <input type="number" id="age" placeholder="Age">
    <input id="church" placeholder="Church">

    <button class="btn-primary" onclick="register()">Submit Registration</button>
    <button class="btn-admin" onclick="showAdminLogin()">Login as Admin</button>
</div>

<!-- GREETING PAGE -->
<div id="greetingPage">
    <h2>See you there! 🎉</h2>
    <img src="ypg.jpg" alt="Event Image">
    <button class="btn-primary" style="margin-top:20px;" onclick="backToRegister()">Back</button>
</div>

<!-- ADMIN LOGIN -->
<div class="container admin-login" id="adminLogin">
    <h2>Admin Login</h2>
    <input type="password" id="adminPassword" placeholder="Password">
    <button class="btn-primary" onclick="loginAdmin()">Login</button>
</div>

<!-- ADMIN PANEL -->
<div class="container admin-panel" id="adminPanel">
    <h2>Registered Participants</h2>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Church</th>
                <th>Team</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="adminTable"></tbody>
    </table>
    <button class="logout" onclick="logoutAdmin()">Logout</button>
</div>

<script type="module">
// FIREBASE CONFIG
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyA_996opw31YVV82k9U7sW98L0LSrv_Asw",
  authDomain: "ypgsevent.firebaseapp.com",
  databaseURL: "https://ypgsevent-default-rtdb.firebaseio.com",
  projectId: "ypgsevent",
  storageBucket: "ypgsevent.firebasestorage.app",
  messagingSenderId: "55497113348",
  appId: "1:55497113348:web:a6113f3c00badd13191a51"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const participantsRef = ref(db, "participants");

// Admin & Teams
const ADMIN_PASSWORD = "youthadmin123";
const teams = [
    { color: "White", name: "Team Truth Bearers" },
    { color: "Red", name: "Gospel Warriors" },
    { color: "Gold", name: "Team Christ Ambassadors" }
];

// REGISTER
window.register = function () {
    const name = document.getElementById("name").value.trim();
    const age = document.getElementById("age").value;
    const church = document.getElementById("church").value.trim();

    if (!name || !age || !church) { alert("Complete all fields"); return; }

    const team = teams[Math.floor(Math.random() * teams.length)];
    push(participantsRef, { name, age, church, team: team.name });

    // Hide registration, show greeting page
    document.getElementById("registerPage").style.display = "none";
    document.getElementById("greetingPage").style.display = "flex";
};

// BACK BUTTON
window.backToRegister = function () {
    document.getElementById("greetingPage").style.display = "none";
    document.getElementById("registerPage").style.display = "block";
};

// ADMIN LOGIN
window.showAdminLogin = function () {
    document.getElementById("registerPage").style.display = "none";
    document.getElementById("adminLogin").style.display = "block";
};

window.loginAdmin = function () {
    if (document.getElementById("adminPassword").value !== ADMIN_PASSWORD) {
        alert("Wrong password"); return;
    }
    document.getElementById("adminLogin").style.display = "none";
    document.getElementById("adminPanel").style.display = "block";
    loadAdmin();
};

// LOAD ADMIN TABLE
window.loadAdmin = function () {
    onValue(participantsRef, (snapshot) => {
        const adminTable = document.getElementById("adminTable");
        adminTable.innerHTML = "";
        snapshot.forEach((child) => {
            const p = child.val();
            const key = child.key;
            const row = document.createElement("tr");
            row.innerHTML = `
                <td data-label="Name">${p.name}</td>
                <td data-label="Age">${p.age}</td>
                <td data-label="Church">${p.church}</td>
                <td data-label="Team">${p.team}</td>
                <td data-label="Action">
                    <button class="delete-btn" onclick="deleteParticipant('${key}')">Delete</button>
                </td>
            `;
            adminTable.appendChild(row);
        });
    });
};

// DELETE PARTICIPANT
window.deleteParticipant = function (key) {
    if (!confirm("Are you sure you want to delete this participant?")) return;
    remove(ref(db, "participants/" + key));
};

// LOGOUT
window.logoutAdmin = function () {
    document.getElementById("adminPanel").style.display = "none";
    document.getElementById("registerPage").style.display = "block";
};
</script>

</body>
</html>
