<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Youth Event Registration</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

body {
    margin:0;
    padding:0;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    min-height:100vh;
    background: linear-gradient(135deg,#1f4037,#99f2c8);
    padding-top:30px;
}

.container {
    width: 100%;
    max-width: 500px;
    background: rgba(255,255,255,0.95);
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.25);
    text-align:center;
}

h2 { margin-bottom:20px; font-size:1.8em; }
h3 { margin:10px 0; }
label { display:block; margin-top:15px; font-weight:600; text-align:left; }
input { width:100%; padding:12px; margin-top:6px; border-radius:10px; border:1px solid #ccc; }

button {
    margin-top:15px;
    padding:12px;
    width:100%;
    border:none;
    border-radius:10px;
    font-weight:600;
    cursor:pointer;
    transition:0.2s;
}

button:hover { opacity:0.9; }

.btn-primary { background: linear-gradient(135deg,#1f4037,#3a7d6a); color:white; }
.btn-admin { background:#eef2f3; color:#1f4037; }

.result, .payment, .admin-login, .admin-panel { display:none; }

.team-logo, .qr-box {
    margin:20px auto;
    width:180px; height:180px;
    border-radius:15px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f5f5f5;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
}

.team-logo img, .qr-box img { max-width:80%; max-height:80%; object-fit:contain; }

.payment-btn {
    margin-top:10px;
    background: linear-gradient(135deg,#f39c12,#e67e22);
    color:white;
}
.payment-btn:hover { opacity:0.9; }

.logout { margin-top:20px; background: linear-gradient(135deg,#555,#333); color:white; }
</style>
</head>
<body>

<!-- REGISTRATION -->
<div class="container" id="registerPage">
    <h2>Youth Event Registration</h2>

    <label>Full Name</label>
    <input id="name">

    <label>Age</label>
    <input type="number" id="age">

    <label>Church</label>
    <input id="church">

    <button class="btn-primary" onclick="register()">Submit</button>
    <button class="btn-admin" onclick="showAdminLogin()">Login as Admin</button>
</div>

<!-- RESULT -->
<div class="container result" id="resultPage">
    <h2>Welcome to Your Team 🎉</h2>
    <h3 id="teamName"></h3>
    <p id="teamColor"></p>
    <div class="team-logo"><img id="teamLogo"></div>
    <button class="payment-btn" onclick="showPayment()">Pay via GCash 💳</button>
</div>

<!-- PAYMENT DASHBOARD -->
<div class="container payment" id="paymentPage">
    <h2>Scan to Pay via GCash</h2>
    <div class="qr-box">
        <img src="https://raw.githubusercontent.com/leahjasolis-source/YPG-S-REGISTRATION/main/gcashqr.jpg" alt="GCash QR">
    </div>
    <button class="btn-primary" onclick="backToResult()">Back</button>
</div>

<!-- ADMIN LOGIN -->
<div class="container admin-login" id="adminLogin">
    <h2>Admin Login</h2>
    <input type="password" id="adminPassword" placeholder="Password">
    <button class="btn-primary" onclick="loginAdmin()">Login</button>
</div>

<!-- ADMIN PANEL -->
<div class="container admin-panel" id="adminPanel">
    <h2>Registered Participants</h2>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Church</th>
                <th>Team</th>
            </tr>
        </thead>
        <tbody id="adminTable"></tbody>
    </table>
    <button class="logout" onclick="logoutAdmin()">Logout</button>
</div>

<script>
const ADMIN_PASSWORD = "youthadmin123";

const teams = [
    { color: "White", name: "Team Truth Bearers", logo:"white.jfif" },
    { color: "Red", name: "Gospel Warriors", logo:"red.jfif" },
    { color: "Gold", name: "Team Christ Ambassadors", logo:"gold.jfif" }
];

let participants = JSON.parse(localStorage.getItem("participants")) || [];

// REGISTER
function register() {
    const name = document.getElementById("name").value.trim();
    const age = document.getElementById("age").value;
    const church = document.getElementById("church").value.trim();
    if(!name||!age||!church){ alert("Complete all fields"); return; }

    const team = teams[Math.floor(Math.random()*teams.length)];

    participants.push({name, age, church, team:team.name, logo:team.logo});
    localStorage.setItem("participants", JSON.stringify(participants));

    document.getElementById("registerPage").style.display="none";
    document.getElementById("resultPage").style.display="block";

    document.getElementById("teamName").innerText = team.name;
    document.getElementById("teamColor").innerText = "Team Color: " + team.color;
    document.getElementById("teamLogo").src = team.logo;
}

// PAYMENT SHOW
function showPayment(){
    document.getElementById("resultPage").style.display="none";
    document.getElementById("paymentPage").style.display="block";
}

function backToResult(){
    document.getElementById("paymentPage").style.display="none";
    document.getElementById("resultPage").style.display="block";
}

// ADMIN
function showAdminLogin(){
    document.getElementById("registerPage").style.display="none";
    document.getElementById("adminLogin").style.display="block";
}

function loginAdmin(){
    if(document.getElementById("adminPassword").value!==ADMIN_PASSWORD){
        alert("Wrong password"); return;
    }
    document.getElementById("adminLogin").style.display="none";
    document.getElementById("adminPanel").style.display="block";
    loadAdmin();
}

function loadAdmin(){
    const adminTable = document.getElementById("adminTable");
    adminTable.innerHTML="";
    participants.forEach(p=>{
        adminTable.innerHTML += `<tr>
            <td>${p.name}</td>
            <td>${p.age}</td>
            <td>${p.church}</td>
            <td>${p.team}</td>
        </tr>`;
    });
}

function logoutAdmin(){
    document.getElementById("adminPanel").style.display="none";
    document.getElementById("registerPage").style.display="block";
}
</script>

</body>
</html>
